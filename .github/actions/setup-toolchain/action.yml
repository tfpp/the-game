name: Set up toolchain
description: Godot (headless), uv for the GDScript linters, and Go, as harness/verify.sh needs.
inputs:
  godot-version:
    description: Godot release to install
    default: 4.7.2
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.2.0
    - name: Set up Rust inspect module
      shell: bash
      run: game/scripts/setup_rust.sh
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.work
        cache-dependency-path: api/go.sum
    - name: Cache Godot
      id: cache-godot
      uses: actions/cache@v6
      with:
        path: ~/.local/bin/godot
        key: godot-${{ inputs.godot-version }}-linux
    - name: Install Godot
      if: steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot-version }}
      run: |
        mkdir -p ~/.local/bin
        curl -fsSL -o /tmp/godot.zip \
          "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d /tmp/godot
        mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/.local/bin/godot
        chmod +x ~/.local/bin/godot
    - shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
