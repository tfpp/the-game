name: Set up toolchain
description: Godot (headless), uv for the GDScript linters, and Go, as harness/verify.sh needs.
inputs:
  godot-version:
    description: Godot release to install
    default: 4.7.2
outputs:
  import-cache-key:
    description: Cache key for game/.godot/imported; save it only from trusted main builds
    value: ${{ steps.import-key.outputs.key }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.2.0
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.work
        cache-dependency-path: api/go.sum
    - name: Cache Godot
      id: cache-godot
      uses: actions/cache@v6
      with:
        path: ~/.local/bin/godot
        key: godot-${{ inputs.godot-version }}-linux
    - name: Install Godot
      if: steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot-version }}
      run: |
        mkdir -p ~/.local/bin
        curl -fsSL -o /tmp/godot.zip \
          "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d /tmp/godot
        mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/.local/bin/godot
        chmod +x ~/.local/bin/godot
    - shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    # Imported assets from the last main build. Godot re-imports anything whose source
    # changed, so the newest main build saves most of the ~35 s import. Restore only: game-ci
    # saves it from main pushes, never from jobs that run agent-written code.
    - name: Import cache key
      id: import-key
      shell: bash
      run: echo "key=godot-import-${{ inputs.godot-version }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
    - name: Restore Godot imports
      uses: actions/cache/restore@v6
      with:
        path: game/.godot/imported
        key: ${{ steps.import-key.outputs.key }}
        restore-keys: godot-import-${{ inputs.godot-version }}-
