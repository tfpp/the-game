name: agent

# Runs a coding agent on an issue or an agent PR. See harness/README.md for triggers and
# setup. Three jobs keep credentials apart:
#   gate     decides whether to run (GITHUB_TOKEN, comments "started")
#   agent    runs harness/run.sh with the model credential only; no write token
#   publish  pushes the agent's commits and opens the PR with an App token, using the
#            default branch's harness, never code from the agent's change
# The run name ("agent #12 implement [bot-7]") lets the Discord bot match workflow_run
# events to its jobs; request_id is its opaque ID for one dispatch.
run-name: >-
  agent #${{ inputs.number || github.event.issue.number || github.event.pull_request.number }}
  ${{ inputs.mode || github.event_name }}${{ inputs.request_id && format(' [{0}]', inputs.request_id) || '' }}

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      number:
        description: Issue number (implement) or agent PR number (revise, resolve-conflicts)
        required: true
      mode:
        type: choice
        options: [implement, revise, resolve-conflicts]
        default: implement
      agent:
        type: choice
        options: [pi, claude, codex]
        default: pi
      pi_model:
        description: Model for the pi agent (default uses PI_MODEL, else openai-codex/gpt-6.1-sol)
        type: choice
        options:
          - default
          - openai-codex/gpt-6.1-sol
          - openai-codex/gpt-6-astra
          - openai-codex/gpt-6-luna
          - anthropic-omp/claude-opus-5-5
          - anthropic-omp/claude-fable-5-1
          - openrouter/deepseek/deepseek-v4.1-flash
          - openrouter/z-ai/glm-5.3
          - openrouter/z-ai/glm-5.3-flash
          - openrouter/qwen/qwen3.8-max-0902
          - openrouter/qwen/qwen3.8-flash
          - openrouter/moonshotai/kimi-k3
        default: default
      reasoning:
        description: Reasoning effort for any agent (default uses AGENT_REASONING_EFFORT, else the agent's own default)
        type: choice
        options: [default, low, medium, high, xhigh, max]
        default: default
      instructions:
        description: Extra instructions for the agent
        required: false
        default: ""
      request_id:
        description: Opaque ID from the Discord bot, echoed in the run name
        required: false
        default: ""

permissions: {}

jobs:
  gate:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent') ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'agent') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/agent')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
      mode: ${{ steps.gate.outputs.mode }}
      agent: ${{ steps.gate.outputs.agent }}
      issue: ${{ steps.gate.outputs.issue }}
      pr: ${{ steps.gate.outputs.pr }}
      branch: ${{ steps.gate.outputs.branch }}
      target: ${{ steps.gate.outputs.target }}
      instructions: ${{ steps.gate.outputs.instructions }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            harness
            .github
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_TRUSTED_BOTS: ${{ vars.AGENT_TRUSTED_BOTS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: harness/gate.sh

  agent:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: agent-run-${{ needs.gate.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      # The pi model for this run; anthropic-omp/* models also need Bun and the Claude token.
      PI_MODEL: ${{ inputs.pi_model != 'default' && inputs.pi_model || vars.PI_MODEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install Claude Code
        if: needs.gate.outputs.agent == 'claude'
        run: curl -fsSL https://claude.ai/install.sh | bash
      - uses: actions/setup-node@v6
        if: needs.gate.outputs.agent == 'codex'
        with:
          node-version: '22'
      - name: Install Codex
        if: needs.gate.outputs.agent == 'codex'
        run: npm install --prefix "$RUNNER_TEMP/codex-cli" @openai/codex && echo "$RUNNER_TEMP/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v6
        if: needs.gate.outputs.agent == 'pi'
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        if: needs.gate.outputs.agent == 'pi' && startsWith(env.PI_MODEL, 'anthropic-omp/')
        with:
          bun-version: 1.4.2
      # The anthropic-omp runtime pulls a ~100 MB native addon; keep bun's download cache.
      - uses: actions/cache@v6
        if: needs.gate.outputs.agent == 'pi' && startsWith(env.PI_MODEL, 'anthropic-omp/')
        with:
          path: ~/.bun/install/cache
          key: pi-bun-${{ runner.os }}-${{ hashFiles('harness/pi/extensions/anthropic-omp/runtime/bun.lock') }}
      - name: Install pi
        if: needs.gate.outputs.agent == 'pi'
        env:
          PI_VERSION: ${{ vars.PI_VERSION || '0.99.1' }}
        run: npm install --prefix "$RUNNER_TEMP/pi-cli" "@earendil-works/pi-coding-agent@$PI_VERSION" && echo "$RUNNER_TEMP/pi-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Configure git
        env:
          NAME: ${{ vars.AGENT_GIT_NAME || 'claude[bot]' }}
          EMAIL: ${{ vars.AGENT_GIT_EMAIL || '209825114+claude[bot]@users.noreply.github.com' }}
        run: |
          git config --global user.name "$NAME"
          git config --global user.email "$EMAIL"
      - name: Gather context
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          PR: ${{ needs.gate.outputs.pr }}
          INSTRUCTIONS: ${{ needs.gate.outputs.instructions }}
        run: |
          printf '%s' "$INSTRUCTIONS" > "$RUNNER_TEMP/instructions.md"
          args=(--issue "$ISSUE" --instructions-file "$RUNNER_TEMP/instructions.md")
          [[ -n "$PR" ]] && args+=(--pr "$PR")
          harness/context.sh "${args[@]}" > "$RUNNER_TEMP/task.md"
          cat "$RUNNER_TEMP/task.md"
      - name: Run agent
        env:
          # pi uses ChatGPT for its default model, imagegen and web search; OpenRouter for
          # openrouter/* models; and Claude only when the model is anthropic-omp/*.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ (needs.gate.outputs.agent == 'claude' || (needs.gate.outputs.agent == 'pi' && startsWith(env.PI_MODEL, 'anthropic-omp/'))) && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          CODEX_AUTH_JSON: ${{ (needs.gate.outputs.agent == 'codex' || needs.gate.outputs.agent == 'pi') && secrets.CODEX_AUTH_JSON || '' }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          OPENROUTER_API_KEY: ${{ needs.gate.outputs.agent == 'pi' && secrets.OPENROUTER_API_KEY || '' }}
          HARNESS_MODEL: ${{ vars.AGENT_MODEL }}
          # Empty: run.sh's per-agent default (Claude low, Codex medium, pi per model).
          HARNESS_REASONING_EFFORT: ${{ inputs.reasoning != 'default' && inputs.reasoning || vars.AGENT_REASONING_EFFORT }}
          HARNESS_MAX_TURNS: ${{ vars.AGENT_MAX_TURNS }}
          AGENT: ${{ needs.gate.outputs.agent }}
          MODE: ${{ needs.gate.outputs.mode }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          ATTEMPTS: ${{ vars.AGENT_ATTEMPTS || 3 }}
        run: |
          if [[ "$AGENT" == codex ]]; then
            export CODEX_HOME="$RUNNER_TEMP/codex-home"
            export HARNESS_MODEL="$CODEX_MODEL"
            trap 'rm -rf -- "$CODEX_HOME"' EXIT
            harness/codex-auth.sh
            unset CODEX_AUTH_JSON
          elif [[ "$AGENT" == pi ]]; then
            export PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi-agent"
            export HARNESS_MODEL="$PI_MODEL" PI_SKIP_VERSION_CHECK=1 PI_TELEMETRY=0
            trap 'rm -rf -- "$PI_CODING_AGENT_DIR"' EXIT
            harness/pi-setup.sh
            unset CODEX_AUTH_JSON
            # The anthropic-omp backend reads the setup token from here; its store stays empty.
            if [[ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then export ANTHROPIC_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN"; fi
            unset CLAUDE_CODE_OAUTH_TOKEN
          fi
          harness/run.sh --agent "$AGENT" --mode "$MODE" --branch "$BRANCH" \
            --task "$RUNNER_TEMP/task.md" --out "$RUNNER_TEMP/harness-out" --attempts "$ATTEMPTS"
      - name: Remove Codex credentials
        if: always() && needs.gate.outputs.agent == 'codex'
        run: rm -rf -- "$RUNNER_TEMP/codex-home"
      - name: Remove pi credentials
        if: always() && needs.gate.outputs.agent == 'pi'
        run: rm -rf -- "$RUNNER_TEMP/pi-agent"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: harness-out
          path: ${{ runner.temp }}/harness-out
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [gate, agent]
    if: always() && needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: agent-publish-${{ needs.gate.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # only for the Claude app token exchange
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: harness-out
          path: ${{ runner.temp }}/harness-out
      # Our own App when configured, otherwise the Claude GitHub App (see harness/README.md).
      - id: app
        if: vars.AGENT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - id: claude
        if: vars.AGENT_APP_CLIENT_ID == ''
        run: |
          token="$(harness/claude-app-token.sh)"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || steps.claude.outputs.token }}
          OUT: ${{ runner.temp }}/harness-out
          MODE: ${{ needs.gate.outputs.mode }}
          AGENT: ${{ needs.gate.outputs.agent }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          PR: ${{ needs.gate.outputs.pr }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          TARGET: ${{ needs.gate.outputs.target }}
          BASE: ${{ github.event.repository.default_branch }}
          AGENT_JOB_RESULT: ${{ needs.agent.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: harness/publish.sh
      - name: Revoke Claude app token
        if: always() && steps.claude.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.claude.outputs.token }}
        run: gh api -X DELETE installation/token || true
