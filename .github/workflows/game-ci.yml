name: game-ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: game-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Verify
        env:
          # The full safety net: never skip the harness or release script self-tests here.
          VERIFY_ALL: '1'
        run: harness/verify.sh
      # Only reviewed code on main refreshes the import cache that other jobs restore.
      - name: Save Godot imports
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: game/.godot/imported
          key: ${{ steps.toolchain.outputs.import-cache-key }}
