name: pages

on:
  push:
    branches: [main]
    paths: ["game/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the in-game changelog's releases come from history and tags
      - name: Install export dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3
      - name: Link export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn /root/.local/share/godot/export_templates/4.7.2.stable \
            ~/.local/share/godot/export_templates/4.7.2.stable || true
      - name: Export web
        env:
          BUILD_VERSION: ${{ github.sha }}
          RELEASE_NOTES: "1"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          GODOT=godot game/scripts/export.sh web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
