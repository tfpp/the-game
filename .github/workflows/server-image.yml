name: server-image

on:
  push:
    branches: [main]
    paths: ["game/**", ".github/workflows/server-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Export dedicated server
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e BUILD_VERSION="${{ github.sha }}" \
            barichello/godot-ci:4.7.2 bash -c 'apt-get update && apt-get install -y --no-install-recommends curl build-essential ca-certificates && game/scripts/setup_rust.sh && GODOT=godot game/scripts/export.sh server'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: game/server.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-server:latest
            ghcr.io/${{ github.repository }}-server:${{ github.sha }}
