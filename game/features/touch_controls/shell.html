<!DOCTYPE html>
<!-- Based on the Godot 4.7.2 Web shell; preserve the engine placeholders when updating. -->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
:root {
	--game-safe-left: env(safe-area-inset-left, 0px);
	--game-safe-top: env(safe-area-inset-top, 0px);
	--game-safe-right: env(safe-area-inset-right, 0px);
	--game-safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
	width: 100%;
	height: 100%;
	overscroll-behavior: none;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	position: fixed;
	top: 0;
	left: 0;
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<script>
// CSS pixels are converted to HUD coordinates by touch_controls.gd. The canvas stays full size.
window.getGameSafeArea = function () {
	const style = getComputedStyle(document.documentElement);
	return JSON.stringify({
		left: parseFloat(style.getPropertyValue('--game-safe-left')) || 0,
		top: parseFloat(style.getPropertyValue('--game-safe-top')) || 0,
		right: parseFloat(style.getPropertyValue('--game-safe-right')) || 0,
		bottom: parseFloat(style.getPropertyValue('--game-safe-bottom')) || 0,
		width: document.documentElement.clientWidth,
		height: document.documentElement.clientHeight,
	});
};

// Godot's canvas keydown listener calls preventDefault() on every key, which blocks browser
// reload shortcuts. Stop those from reaching Godot so the browser handles them: Cmd+R,
// Cmd+Shift+R (macOS), Ctrl+R, Ctrl+Shift+R and F5 (with any modifiers).
window.addEventListener('keydown', function (evt) {
	const isR = evt.code === 'KeyR' || (evt.key || '').toLowerCase() === 'r';
	const reload = evt.key === 'F5' || (isR && (evt.metaKey || evt.ctrlKey) && !evt.altKey);
	// Keep native Mac screenshots out of Godot's preventDefault(), with or without
	// Control (copy to clipboard). Command itself still reaches the input helper,
	// which releases pointer lock before macOS consumes the final digit.
	const screenshot = /^Mac/.test(navigator.platform) && evt.metaKey && evt.shiftKey
		&& !evt.altKey && ['Digit3', 'Digit4', 'Digit5'].includes(evt.code);
	if (reload || screenshot) {
		evt.stopImmediatePropagation();
	}
}, true);
		</script>
		<script id="game-scissor-cache">
// Emscripten reads SCISSOR_TEST while saving GL state every frame. Some drivers
// synchronously stall on getParameter; track this one boolean in JavaScript.
(function () {
	if (typeof WebGL2RenderingContext === 'undefined') return;
	const prototype = WebGL2RenderingContext.prototype;
	const getParameter = prototype.getParameter;
	const enable = prototype.enable;
	const disable = prototype.disable;
	const states = new WeakMap();
	function state(context) {
		let value = states.get(context);
		if (!value) {
			value = { enabled: null };
			states.set(context, value);
			context.canvas.addEventListener('webglcontextlost', function () {
				// Read the restored native state on first use. A restoration handler
				// may enable scissoring before any later event listeners run.
				value.enabled = null;
			});
		}
		if (value.enabled === null) {
			value.enabled = getParameter.call(context, context.SCISSOR_TEST);
		}
		return value;
	}
	prototype.getParameter = function (parameter) {
		if (parameter !== this.SCISSOR_TEST || this.isContextLost()) {
			return getParameter.call(this, parameter);
		}
		return state(this).enabled;
	};
	prototype.enable = function (capability) {
		if (capability === this.SCISSOR_TEST && !this.isContextLost()) {
			const value = state(this);
			enable.call(this, capability);
			value.enabled = true;
			return;
		}
		return enable.call(this, capability);
	};
	prototype.disable = function (capability) {
		if (capability === this.SCISSOR_TEST && !this.isContextLost()) {
			const value = state(this);
			disable.call(this, capability);
			value.enabled = false;
			return;
		}
		return disable.call(this, capability);
	};
}());
		</script>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script id="game-pointer-lock">
// Capture remains synchronous inside Godot's user-gesture handler. The browser
// may deliver a click before the document has focus, or reject a request after
// focus changes. Never retry asynchronously: a fresh Click to play / Resume is
// required, and Godot's real pointer-lock state drives that existing recovery UI.
(function () {
	const canvas = document.getElementById('canvas');
	const request = canvas.requestPointerLock;
	if (!request) return;
	canvas.requestPointerLock = function (...args) {
		if (!document.hasFocus()) window.focus();
		canvas.focus({ preventScroll: true });
		if (!document.hasFocus()) return;
		try {
			const pending = request.apply(canvas, args);
			// Older browsers return void; newer ones reject a Promise on denial.
			if (pending && typeof pending.catch === 'function') {
				return pending.catch(function () {});
			}
			return pending;
		} catch (error) {
			// Legacy synchronous refusal also leaves the pointer free. Do not
			// synthesize a successful lock or suppress pointerlockerror events.
		}
	};
}());
		</script>
		<script>
// Cache busting (#371): the version-mismatch "Reload page" button adds ?v=<server build>.
// Pass it to the engine script and to the files the engine fetches (wasm, pck), so the
// browser downloads the new build instead of reusing its cached copy.
const CACHE_BUST = new URLSearchParams(window.location.search).get('v') || '';
function withCacheBust(url) {
	if (!CACHE_BUST) {
		return url;
	}
	const u = new URL(url, window.location.href);
	if (u.origin !== window.location.origin) {
		return url;
	}
	u.searchParams.set('v', CACHE_BUST);
	return u.toString();
}
if (CACHE_BUST) {
	const nativeFetch = window.fetch.bind(window);
	window.fetch = function (input, init) {
		return nativeFetch(typeof input === 'string' ? withCacheBust(input) : input, init);
	};
}
document.write('<script src="' + withCacheBust('$GODOT_URL') + '"><\/script>');
		</script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
